name: flutter_mobx_structure
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  # native 
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  # mobx
  mobx: ^2.7.0
  flutter_mobx: ^2.4.0
  # router
  go_router: ^18.1.4
  # network
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  # dependency injection
  get_it: ^9.3.0
  injectable: ^3.0.0
  # json - annotation
  json_annotation: ^4.12.0
  # localization
  intl: ^0.20.3
  # storage
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0  
  # env
  envied: ^1.3.10
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1 # Latest sürüm, mobx_codegen ile uyumsuz. Güncelleme yapılırken dikkat!
  mobx_codegen: ^2.8.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2
  envied_generator: ^1.3.10

flutter:
  uses-material-design: true
  generate: true
